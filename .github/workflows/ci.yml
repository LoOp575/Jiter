name: JITER CI & Polyglot Native APK

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  python-lab:
    name: Stage 1 — Python Math Lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Python formula unit tests
        run: python3 -m unittest discover -s test-lab/simulations -p "test_*.py" -v
      - name: Run 4 closed-loop experiments
        run: python3 test-lab/simulations/run_experiments.py

  native-c-cpp:
    name: Native Engine — C (Packets) + C++ (Pool & Scheduler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run C11 + C++17 native engine tests
        run: make -C engine-native clean test

  rust-math:
    name: Math Engine — Rust (Formulas #1/#2/#3 + C-ABI FFI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust unit & FFI tests
        working-directory: engine-rust
        run: cargo test -- --nocapture

  relay-server:
    name: Stage 3 — JITER Relay Edge Server (Rust UDP + XOR FEC + Pacer)
    runs-on: ubuntu-latest
    needs: [ rust-math ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Run Relay unit & real UDP integration tests
        working-directory: relay
        run: cargo test -- --nocapture
      - name: Build release jiter-relay binary
        working-directory: relay
        run: cargo build --release && ./target/release/jiter-relay --help

  control-plane:
    name: Stage 5 — Zero-Config Control Plane (Node.js / Vercel / Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Control Plane unit & live HTTP bootstrap tests
        run: npm --prefix control-plane test

  android-poc:
    name: Android APK — Kotlin + C++ + C + Rust (libjiter_native.so)
    runs-on: ubuntu-latest
    needs: [ native-c-cpp, rust-math, relay-server, control-plane ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Ensure Android NDK and CMake 3.22.1 are available
        run: |
          SDK_MANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "${ANDROID_HOME}/ndk" ] || [ -z "$(ls -A "${ANDROID_HOME}/ndk" 2>/dev/null)" ]; then
            yes | "${SDK_MANAGER}" --install "ndk;27.2.12479018"
          fi
          if [ ! -d "${ANDROID_HOME}/cmake/3.22.1" ]; then
            yes | "${SDK_MANAGER}" --install "cmake;3.22.1"
          fi
          NDK_PATH="$(ls -d "${ANDROID_HOME}/ndk/"* | sort -V | tail -n 1)"
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> "${GITHUB_ENV}"
          echo "Using NDK: ${NDK_PATH}"

      - name: Cross-compile Rust Mathematical Engine (arm64-v8a, x86_64)
        run: ./scripts/build-rust-android.sh arm64-v8a,x86_64

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run Kotlin Engine & Config Unit Tests
        working-directory: android
        run: |
          if ! gradle testDebugUnitTest --stacktrace > /tmp/gradle-test.log 2>&1; then
            cat /tmp/gradle-test.log
            ERR_SUMMARY=$(grep -E "(^e: |FAILED|Exception|AssertionError|Execution failed|Could not|Unresolved|error:|> Task :)" /tmp/gradle-test.log | tail -n 25 | tr '\n' ' ')
            echo "::error::Gradle testDebugUnitTest failed: ${ERR_SUMMARY}"
            exit 1
          fi
          cat /tmp/gradle-test.log

      - name: Assemble Debug APK (linking C + C++ + Rust into libjiter_native.so)
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Verify APK size & bundled libjiter_native.so
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep libjiter_native.so

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiter-native-polyglot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
