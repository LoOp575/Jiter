name: JITER CI & Debug APK

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  python-lab:
    name: Stage 1 — Python Math Lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Python formula unit tests
        run: python3 -m unittest discover -s test-lab/simulations -p "test_*.py" -v
      - name: Run 4 closed-loop experiments
        run: python3 test-lab/simulations/run_experiments.py

  android-poc:
    name: Stage 2 — Android Kotlin PoC & APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run Kotlin Engine Unit Tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Check Debug APK size
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiter-stage2-poc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
